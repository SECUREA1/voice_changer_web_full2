<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='wrench.svg') }}">
    <script src="{{ url_for('static', filename='libs/solana-web3.min.js') }}"></script>
    <script src="{{ url_for('static', filename='libs/ethers.umd.min.js') }}"></script>
    <script src="{{ url_for('static', filename='libs/cardano-connector.js') }}"></script>
    <script src="{{ url_for('static', filename='libs/bech32.js') }}"></script>
    <script src="{{ url_for('static', filename='wallet.js') }}"></script>
    <style>
        body { font-family: Arial, sans-serif; padding:40px; background:#1a1a1a; color:#ffd700; }
        .container { max-width:420px; margin:0 auto; background:#222; padding:20px; border-radius:8px; border:2px solid #ffd700; }
        label { display:block; margin-top:15px; }
        input { width:100%; padding:8px; margin-top:5px; box-sizing:border-box; }
        button { margin-top:15px; padding:10px 20px; background:#b30000; color:#ffd700; border:none; cursor:pointer; }
        button:hover { background:#ff0000; }
    </style>
</head>
<body>
<div class="container">
    {% if error %}<p style="color:red;">{{ error }}</p>{% endif %}
    <form method="post">
        <div>
            <label for="chain-select">Chain:</label>
            <select id="chain-select">
                <option value="solana">Solana (Phantom)</option>
                <option value="ethereum">Ethereum (MetaMask)</option>
                <option value="bsc">BNB Chain (MetaMask)</option>
                <option value="cardano">Cardano (Nami/Eternl)</option>
                <option value="zorg">ZORG</option>
                <option value="rednode">REDNODE</option>
            </select>
            <button type="button" id="connect-wallet">🔗 Connect Wallet</button>
            <input type="hidden" id="wallet" name="wallet"/>
            <div id="wallet-display"></div>
        </div>
        <label>Username
            <input type="text" name="username" required>
        </label>
        <label>Password
            <input type="password" name="password" required>
        </label>
        <button type="submit">Sign Up</button>
    </form>
</div>
<script>
    const chainSelect = document.getElementById('chain-select');
    const connectBtn = document.getElementById('connect-wallet');
    connectBtn.onclick = async () => {
        const chain = chainSelect.value;
        if(chain === 'solana')            await connectPhantom();
        else if(['ethereum','bsc'].includes(chain)) await connectMetamask();
        else if(chain === 'cardano')      await connectCardano();
        else                               await connectCustom();
    };

    const CHAIN_KEY = 'mixer_current_chain';
    const WALLET_KEY = 'mixer_current_wallet';
    const USER_KEY  = 'mixer_username';
    const USER_DATA_KEY = 'session_user';

    function loadUserData(){
        try{ return JSON.parse(localStorage.getItem(USER_DATA_KEY)) || {}; }catch{return {};}
    }

    function saveUserData(name,wallet){
        localStorage.setItem(USER_DATA_KEY, JSON.stringify({username:name||'', wallet:wallet||''}));
    }

    function setWallet(addr){
        document.getElementById('wallet').value = addr;
        document.getElementById('wallet-display').textContent = addr;
        localStorage.setItem(WALLET_KEY, addr);
        localStorage.setItem(CHAIN_KEY, chainSelect.value);
        const uname = document.querySelector('input[name="username"]').value;
        saveUserData(uname, addr);
    }

    document.querySelector('form').addEventListener('submit', () => {
        const user = document.querySelector('input[name="username"]').value;
        const wallet = document.getElementById('wallet').value;
        localStorage.setItem(USER_KEY, user);
        localStorage.setItem(CHAIN_KEY, chainSelect.value);
        saveUserData(user, wallet);
    });

    async function connectPhantom(){
        if(window.solana?.isPhantom){
            const r = await window.solana.connect();
            setWallet(r.publicKey.toString());
        } else {
            alert('Phantom not found.');
        }
    }
    async function connectMetamask(){
        if(!window.ethereum){ alert('Metamask not found.'); return; }
        await window.ethereum.request({method:'eth_requestAccounts'});
        const provider = new ethers.providers.Web3Provider(window.ethereum);
        const addr = await provider.getSigner().getAddress();
        setWallet(addr);
    }
    async function connectCardano(){
        const api = window.cardano?.nami || window.cardano?.eternl;
        if(!api){ alert('Install Nami or Eternl.'); return; }
        const walletApi = await api.enable();
        const addr = toBech32("addr", await walletApi.getChangeAddress());
        setWallet(addr);
    }
    async function connectCustom(){
        const addr = prompt(`Enter your ${chainSelect.value.toUpperCase()} wallet address:`);
        if(addr) setWallet(addr);
    }
</script>
<script>
  window.APP_USER = "{{ session_username }}";
  window.APP_WALLET = "{{ session_wallet }}";
</script>
<script src="{{ url_for('static', filename='session.js') }}"></script>
</body>
</html>
